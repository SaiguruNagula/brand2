<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900&amp;display=swap');
      .bm-brand {
        font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 88px;
        font-weight: 900;
        letter-spacing: -3px;
        fill: #000000;
      }
      .bm-masala {
        font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 88px;
        font-weight: 900;
        letter-spacing: -3px;
        fill: #FBAF18;
      }
      .bm-dot {
        fill: #FF4438;
      }
      .bm-tagline {
        font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 4.8px;
        fill: #000000;
      }
    </style>
  </defs>
  <g transform="translate(40, 20)">
    <!-- brand -->
    <text x="0" y="85" class="bm-brand">brand</text>
    <!-- masala. -->
    <text x="0" y="172" class="bm-masala">masala</text>
    <circle cx="318" cy="158" r="14" class="bm-dot" />
    <!-- A BRAND CONSULTANCY FIRM -->
    <text x="2" y="218" class="bm-tagline">A BRAND CONSULTANCY FIRM</text>
  </g>
</svg>
